<html>
    <head>
        <title>unorder list</title>
    </head>

    <body>
        <ul>
            <li>Python</li>
            <li>Java</li>
            <li>Flutter</li>
            <li>Data Science</li>
            <li>AI</li>
        </ul>
            <hr>
            <br>
        <ul style="list-style-type: circle;">
            <li>Python</li>
            <li>Java</li>
            <li>Flutter</li>
            <li>Data Science</li>
            <li>AI</li>
        </ul>
           <hr>
           <br>
        <ul style="list-style-type: disc;">
            <li>Python</li>
            <li>Java</li>
            <li>Flutter</li>
            <li>Data Science</li>
            <li>AI</li>
        </ul>
        <hr>
            <br>
        <ul style="list-style-type: square;">
            <li>Python</li>
            <li>Java</li>
            <li>Flutter</li>
            <li>Data Science</li>
            <li>AI</li>
        </ul>
        <ul style="list-style-type:none;">
            <li>Python</li>
            <li>Java</li>
            <li>Flutter</li>
            <li>Data Science</li>
            <li>AI</li>
        </ul>
    </body>
</html>
